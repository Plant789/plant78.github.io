<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carla's Portfolio</title>
    <link rel="stylesheet" href="../css/css.css">
</head>
<body>
    <header class="site-header">
        <h1>Carla's Portfolio</h1>
    </header>

    <main>
        <section class="gallery-section" aria-labelledby="artwork-heading">
            <h2 id="artwork-heading">My Artwork</h2>
            <div class="artwork-gallery">
                <img src="../images/Carla%20PFP.jpg"
                     alt="Character artwork portrait">
                <img src="../images/Tinkaton%20Squeaky%20Hammer.jpg"
                     alt="Tinkaton holding a squeaky hammer">
            </div>
        </section>

        <section class="gallery-section" aria-labelledby="animation-heading">
            <h2 id="animation-heading">My Animations</h2>
            <div class="animation-gallery">
                <figure>
                    <figcaption>Rain Drop Animation</figcaption>
                    <video controls preload="metadata">
                        <source src="../images/Rain%20Drop%20Animation%20Final%20CTalley.mp4"
                                type="video/mp4">
                        Your browser does not support the video element.
                    </video>
                </figure>

                <figure>
                    <figcaption>Basculin Animation</figcaption>
                    <video controls preload="metadata">
                        <source src="../images/Basculin%20Animation%2030%20fps.mp4"
                                type="video/mp4">
                        Your browser does not support the video element.
                    </video>
                </figure>
            </div>
        </section>
    </main>

    <footer class="social-section" id="socials">
        <h2>Find Me on Social Media</h2>
        <p>Follow along for more art, animations, and updates!</p>

        <nav class="social-links" aria-label="Social media links">
            <a class="social-link youtube" href="https://www.youtube.com/@CarlathePlant-p3i" target="_blank" rel="noopener noreferrer">
                <span class="social-name">YouTube</span>
                <span class="social-handle">@CarlathePlant-p3i</span>
            </a>
            <a class="social-link tiktok" href="https://www.tiktok.com/@carladaplant" target="_blank" rel="noopener noreferrer">
                <span class="social-name">TikTok</span>
                <span class="social-handle">@carladaplant</span>
            </a>
            <a class="social-link instagram" href="https://www.instagram.com/carla_the_plant/" target="_blank" rel="noopener noreferrer">
                <span class="social-name">Instagram</span>
                <span class="social-handle">@carla_the_plant</span>
            </a>
        </nav>
</footer>
</body>
</html>
